<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReacXtract</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#6366f1', primaryDark: '#4f46e5' } } }
    }
  </script>

  <style>
    body { background: linear-gradient(135deg, #1e1b4b 0%, #111827 100%); min-height: 100vh; }
    #drop-zone.dragover { border-color: #6366f1; background-color: rgba(99, 102, 241, 0.1); }
  </style>
</head>

<body class="text-gray-200 antialiased">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-gray-900/70 backdrop-blur-xl border border-gray-700/50 rounded-2xl shadow-2xl p-8 space-y-8">

      <div class="text-center">
        <h1 class="text-4xl font-bold bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">
          ReacXtract
        </h1>
        <p class="mt-2 text-gray-400">提取你需要的内容</p>
      </div>

      <div class="space-y-5">
        <!-- API Key -->
        <div>
          <label for="apiKey" class="block text-sm font-medium text-gray-300 mb-1.5">API Key</label>
          <input type="password" id="apiKey" placeholder="sk-..."
                 class="w-full px-4 py-3 bg-gray-800/60 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all duration-200"/>
        </div>

        <!-- 拖拽上传区域 -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">文件（支持拖拽或点击选择）</label>
          <div id="drop-zone"
               class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center transition-all duration-200 cursor-pointer hover:border-indigo-500/50 bg-gray-800/30 min-h-[140px] flex flex-col items-center justify-center">

            <div class="text-gray-400 mb-3">
              <svg class="w-12 h-12 mx-auto mb-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
              </svg>
              <p>拖拽文件到这里，或</p>
              <p class="text-indigo-400 underline mt-1">点击选择文件</p>
            </div>

            <!-- 隐藏的真实 input -->
            <input type="file" id="files" multiple class="hidden" />
          </div>
        </div>

        <button onclick="run()"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-medium rounded-lg shadow-lg hover:shadow-indigo-500/30 transform hover:-translate-y-0.5 transition-all duration-200">
          Extract
        </button>
      </div>

      <div id="output" class="mt-6 p-4 bg-gray-950/50 rounded-xl border border-gray-800 min-h-[120px] text-sm text-gray-300 whitespace-pre-wrap overflow-auto max-h-96"></div>

    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
